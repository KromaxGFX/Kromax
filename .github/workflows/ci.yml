# KromaxGFX — Continuous Integration
#
# Matrix: ubuntu-latest (Linux), windows-latest (MSYS2/MinGW64), macos-latest (ARM64)
# Runs: configure, build, test (ctest), static analysis (clang-tidy), format check

name: CI

on:
  push:
    branches: [main, feature/*]
  pull_request:
    branches: [main]

env:
  # Pin CMake version for reproducibility
  CMAKE_VERSION: "3.28.3"

jobs:
  # ---------------------------------------------------------------------------
  # Linux (Ubuntu 24.04)
  # ---------------------------------------------------------------------------
  linux:
    name: Linux (GCC 13 / Clang 17)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        build_type: [Debug, Release]
        include:
          - compiler: gcc
            cc: gcc-13
            cxx: g++-13
          - compiler: clang
            cc: clang-17
            cxx: clang++-17
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies (Ubuntu)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            cmake ninja-build \
            ${{ matrix.cc }} ${{ matrix.cxx }} \
            libvulkan-dev vulkan-tools \
            libx11-dev libxcb1-dev libxcb-randr0-dev libxcb-xfixes0-dev \
            libwayland-dev wayland-protocols \
            clang-tidy-17 clang-format-17 \
            python3-pip
          # Ensure clang-tidy/format are on PATH as 'clang-tidy'/'clang-format'
          sudo update-alternatives --install /usr/bin/clang-tidy clang-tidy /usr/bin/clang-tidy-17 100
          sudo update-alternatives --install /usr/bin/clang-format clang-format /usr/bin/clang-format-17 100

      - name: Configure (linux-${{ matrix.build_type | lower }})
        run: |
          cmake --preset "linux-${{ matrix.build_type | lower }}" \
            -DCMAKE_C_COMPILER="${{ matrix.cc }}" \
            -DCMAKE_CXX_COMPILER="${{ matrix.cxx }}"

      - name: Build
        run: cmake --build --preset "linux-${{ matrix.build_type | lower }}" --parallel

      - name: Run tests (ctest)
        run: |
          cd build/linux-${{ matrix.build_type | lower }}
          ctest --output-on-failure --parallel $(nproc)

      - name: Static analysis (clang-tidy) — Debug only
        if: matrix.build_type == 'Debug'
        run: |
          cd build/linux-debug
          run-clang-tidy-17 -p . -quiet -header-filter=.* 2>&1 | head -100 || true

      - name: Format check (clang-format) — Debug only
        if: matrix.build_type == 'Debug'
        run: |
          find src include -name "*.h" -o -name "*.cpp" -o -name "*.hpp" | \
            xargs clang-format-17 --dry-run --Werror

  # ---------------------------------------------------------------------------
  # Windows (MSYS2 / MinGW64)
  # ---------------------------------------------------------------------------
  windows:
    name: Windows (MSYS2 MinGW64)
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: >-
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-clang
            mingw-w64-x86_64-vulkan-headers
            mingw-w64-x86_64-vulkan-loader
            mingw-w64-x86_64-clang-tools-extra
            python3-pip

      - name: Configure (debug)
        run: |
          export PATH="/c/msys64/mingw64/bin:/c/msys64/usr/bin:$PATH"
          cmake --preset debug

      - name: Build
        run: |
          export PATH="/c/msys64/mingw64/bin:/c/msys64/usr/bin:$PATH"
          cmake --build --preset debug --parallel

      - name: Run tests (ctest)
        run: |
          export PATH="/c/msys64/mingw64/bin:/c/msys64/usr/bin:$PATH"
          cd build/debug
          ctest --output-on-failure --parallel $(nproc)

      - name: Static analysis (clang-tidy)
        run: |
          export PATH="/c/msys64/mingw64/bin:/c/msys64/usr/bin:$PATH"
          cd build/debug
          run-clang-tidy -p . -quiet -header-filter=.* 2>&1 | head -100 || true

      - name: Format check (clang-format)
        run: |
          export PATH="/c/msys64/mingw64/bin:/c/msys64/usr/bin:$PATH"
          find src include -name "*.h" -o -name "*.cpp" -o -name "*.hpp" | \
            xargs clang-format --dry-run --Werror

  # ---------------------------------------------------------------------------
  # macOS (ARM64 Apple Silicon)
  # ---------------------------------------------------------------------------
  macos:
    name: macOS (ARM64 Clang)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies (macOS)
        run: |
          brew update
          brew install cmake ninja vulkan-headers vulkan-loader moltenvk
          # clang-tidy/format come with Xcode command line tools

      - name: Configure (debug)
        run: |
          cmake -S . -B build/debug \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DKX_BUILD_EXAMPLES=ON \
            -DKX_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build/debug --parallel

      - name: Run tests (ctest)
        run: |
          cd build/debug
          ctest --output-on-failure --parallel $(sysctl -n hw.ncpu)

      - name: Format check (clang-format)
        run: |
          find src include -name "*.h" -o -name "*.cpp" -o -name "*.hpp" | \
            xargs clang-format --dry-run --Werror

  # ---------------------------------------------------------------------------
  # Summary
  # ---------------------------------------------------------------------------
  summary:
    name: CI Summary
    needs: [linux, windows, macos]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ needs.linux.result }}" != "success" ]] || \
             [[ "${{ needs.windows.result }}" != "success" ]] || \
             [[ "${{ needs.macos.result }}" != "success" ]]; then
            echo "::error::One or more CI jobs failed"
            exit 1
          fi
          echo "All CI jobs passed ✓"